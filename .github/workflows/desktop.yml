# Builds Poki Setup (desktop/) for Windows (MSI + NSIS) with the Tauri shell, after the core tests.
# The macOS app is native SwiftUI and builds in desktop-mac.yml. Runs on demand, on a desktop-vX.Y.Z
# tag, or on dev/desktop-* branch pushes on the fork only.
name: desktop

on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the installers to a GitHub release (needs a desktop-v* tag)
        type: boolean
        default: false
  push:
    tags: ['desktop-v*.*.*']
    # Branch pushes build only on the fork (ZhehanZhang/poki-remote), never upstream: the jobs
    # below check the repository.
    branches: ['dev/desktop-*']

permissions:
  contents: write

jobs:
  core:
    name: core tests (Linux)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.repository == 'ZhehanZhang/poki-remote'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test -p poki-setup-core -p poki-setup-cli --manifest-path desktop/Cargo.toml
        env: { POKI_SETUP_FILE_SECRETS: "1" }

  build:
    name: ${{ matrix.name }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-2022
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.targets }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: npm ci --no-audit --no-fund
        working-directory: desktop/app
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        # Signing and notarization: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID here once the
        # secrets exist. An empty value makes the bundler try to import nothing and fail, so they
        # are not listed until then; the unsigned app opens with right-click > Open.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
          tagName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') && inputs.release) && github.ref_name || '' }}
          releaseName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') && inputs.release) && 'Poki Setup __VERSION__' || '' }}
          releaseDraft: true
          prerelease: true
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/target -path '*/release/bundle/*' \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: poki-setup-${{ runner.os }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
