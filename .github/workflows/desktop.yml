# Builds Poki Setup (desktop/) for macOS (universal DMG) and Windows (MSI + NSIS). Runs on demand
# or on a desktop-vX.Y.Z tag, never on branch pushes. The macOS build is unsigned until a
# Developer ID certificate is in the repository's secrets (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID); tauri-action signs and notarizes
# by itself when they are set.
name: desktop

on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the installers to a GitHub release (needs a desktop-v* tag)
        type: boolean
        default: false
  push:
    tags: ['desktop-v*.*.*']

permissions:
  contents: write

jobs:
  core:
    name: core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: cargo test -p poki-setup-core -p poki-setup-cli --manifest-path desktop/Cargo.toml
        env: { POKI_SETUP_FILE_SECRETS: "1" }

  build:
    name: ${{ matrix.name }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-2022
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.targets }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: npm ci --no-audit --no-fund
        working-directory: desktop/app
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
          tagName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') && inputs.release) && github.ref_name || '' }}
          releaseName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') && inputs.release) && 'Poki Setup __VERSION__' || '' }}
          releaseDraft: true
          prerelease: true
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/target -path '*/release/bundle/*' \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: poki-setup-${{ runner.os }}
          path: out/*
          if-no-files-found: error
