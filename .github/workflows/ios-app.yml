# Builds the Poki iPhone app (native/ios-app) as an unsigned IPA with its Live Activity widget, runs it
# on the iOS Simulator, and takes a screenshot of every screen in light and dark mode. It is signed when
# it is installed (see native/ios-app/README.md).
name: iOS app

on:
  # Manual only (Actions > Run workflow), so nothing runs on every push in this repository.
  workflow_dispatch:
  # The release workflow builds the app from the tagged commit with the release's version.
  workflow_call:
    inputs:
      version: { type: string, required: true }
      build: { type: string, required: true }

permissions:
  contents: read

jobs:
  # Poki's in-process automation code on a fresh simulator: read, tap, type and read back; open,
  # switch and end apps; and the idle cycle (close the session, refuse a touch, open a new one).
  inprocess:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Field check
        run: POKI_CHECK_OUT=out/field native/ios-app/scripts/inprocess-sim/check.sh
      - name: Apps check
        run: POKI_CHECK_OUT=out/apps native/ios-app/scripts/inprocess-sim/check.sh --apps
      - name: Idle cycle check (close, refuse, reopen)
        run: POKI_CHECK_OUT=out/cycle native/ios-app/scripts/inprocess-sim/check.sh --cycle
      - name: Idle cycle check with Poki's own session (not XCTest's shared one)
        if: always()
        run: POKI_INPROCESS_OWNED_SESSION=1 POKI_CHECK_OUT=out/cycle-owned native/ios-app/scripts/inprocess-sim/check.sh --cycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inprocess-check
          path: out/
          if-no-files-found: ignore

  app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: PokiLauncher (Rust static library for the phone)
        run: |
          set -euo pipefail
          # idevice at the revision bin/setup pins, with Poki's patch (run_over_rsd).
          native/launcher/fetch-idevice.sh
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios --manifest-path native/launcher/Cargo.toml
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
          ls -la native/launcher/target/aarch64-apple-ios/release/libpoki_launcher.a
          # The C ABI's symbols, for the log (the app's link step is the real check).
          (nm -g native/launcher/target/aarch64-apple-ios/release/libpoki_launcher.a 2>/dev/null | grep -E '_poki_(launcher|pair|string)_' | sort -u) || echo "nm listed no poki_ symbols"

      - name: Local connection tests
        run: swift test --package-path native/ios/PokiLoopback

      - name: PokiCore tests
        timeout-minutes: 12
        run: swift test --package-path native/ios/PokiCore

      - name: Developer disk image mirror answers
        run: |
          # The files PokiCore's DeveloperDiskImage.ensure downloads on the phone.
          for f in BuildManifest.plist Image.dmg Image.dmg.trustcache Image.dmg.cryptex_info Image.dmg.root_hash; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/doronz88/DeveloperDiskImage/main/PersonalizedImages/Xcode_iOS_DDI_Cryptex/$f")
            echo "$f $code"; test "$code" = 200
          done

      - name: Assets and project
        run: |
          native/ios-app/scripts/make-assets.sh
          brew install xcodegen
          xcodegen generate --spec native/ios-app/project.yml
          xcodegen generate --spec native/ios-app/project-external.yml

      - name: Build and package both connection options (unsigned)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          mkdir -p build out
          VERSION="${RELEASE_VERSION:-$(cat native/ios-app/VERSION)}"
          BUILD="${RELEASE_BUILD:-${{ github.run_number }}}"
          for edition in local external; do
            project=Poki
            ipa=Poki-unsigned.ipa
            if [ "$edition" = external ]; then project=PokiExternal; ipa=Poki-external-unsigned.ipa; fi
            xcodebuild build \
              -project "native/ios-app/$project.xcodeproj" -scheme Poki -configuration Release \
              -destination generic/platform=iOS -derivedDataPath "build/app-$edition" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ARCHS=arm64 \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
              2>&1 | tee "build/app-$edition.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* "
            native/ios-app/scripts/package-app.sh \
              "build/app-$edition/Build/Products/Release-iphoneos/Poki.app" \
              "$edition" "out/$ipa" "$VERSION" "$BUILD"
            python3 native/ios-app/scripts/export-signing.py \
              "build/app-$edition/Build/Products/Release-iphoneos/Poki.app" \
              "$edition" "out/signing/$edition"
          done
          ditto -c -k --keepParent out/signing out/Poki-signing.zip
          (cd out && shasum -a 256 *.ipa | tee SHA256SUMS)
          for ipa in out/Poki-unsigned.ipa out/Poki-external-unsigned.ipa; do
            unzip -p "$ipa" Payload/Poki.app/Info.plist > build/ipa-Info.plist
            V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/ipa-Info.plist)
            B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ipa-Info.plist)
            echo "$ipa: Poki $V ($B)"; test "$V" = "$VERSION" && test "$B" = "$BUILD"
          done

      # The app on the iOS Simulator: it launches, stays up, and draws its first screen. The launcher
      # cannot reach a simulator's developer services, so this checks the shell, not automation.
      - name: Simulator smoke test
        run: |
          set -euo pipefail
          xcodebuild build \
            -project native/ios-app/Poki.xcodeproj -scheme Poki -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 2>&1 | tee build/sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=build/sim/Build/Products/Debug-iphonesimulator/Poki.app
          test -d "$APP"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"];print(r[-1]["identifier"])')
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]];print(d[-1]["identifier"])')
          UDID=$(xcrun simctl create poki-smoke "$TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p out/simulator
          xcrun simctl launch "$UDID" nz.zheha.poki
          # Long enough for the first-run disk image download (about 20 MB) to finish.
          alive=1
          for t in $(seq 60); do
            sleep 1
            # Listed to a file first: grep -q in a pipe would end launchctl with SIGPIPE under pipefail.
            xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
            grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { alive=0; echo "Poki is gone after $t s"; break; }
          done
          xcrun simctl io "$UDID" screenshot out/simulator/home.png || true
          ls -la "$(xcrun simctl get_app_container "$UDID" nz.zheha.poki data 2>/dev/null)/Library/Application Support/Poki/ddi" 2>/dev/null || true
          if [ "$alive" = 0 ]; then
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Poki"' --style compact 2>/dev/null | tail -60 || true
            echo "--- crash reports"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/Poki* 2>/dev/null | head -2); do echo "== $f"; head -120 "$f"; cp "$f" out/simulator/ || true; done
            exit 1
          fi
          echo "Poki ran on the simulator for 60 s"
          # Every screen, light and dark, for the UI check.
          mkdir -p shots
          crashed=0
          for look in light dark; do
            xcrun simctl ui "$UDID" appearance "$look"
            for screen in home setup connect debug activity; do
              xcrun simctl terminate "$UDID" nz.zheha.poki || true
              xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen "$screen" > /dev/null
              sleep 4
              xcrun simctl io "$UDID" screenshot "shots/$screen-$look.png" > /dev/null
              xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
              grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { echo "::error::Poki died on the $screen screen ($look)"; crashed=1; }
            done
            xcrun simctl terminate "$UDID" nz.zheha.poki || true
            xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen home -pokiSample YES > /dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/home-sample-$look.png" > /dev/null
            xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
            grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { echo "::error::Poki died on the sample home screen ($look)"; crashed=1; }
          done
          # The same screens on an iPad (regular width), where Poki sits beside the app it drives.
          PADTYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPad Pro") and "11" in x["name"]];print(d[-1]["identifier"])')
          PAD=$(xcrun simctl create poki-pad "$PADTYPE" "$RUNTIME")
          xcrun simctl boot "$PAD" && xcrun simctl bootstatus "$PAD" -b
          xcrun simctl install "$PAD" "$APP"
          for screen in home setup connect; do
            xcrun simctl terminate "$PAD" nz.zheha.poki 2>/dev/null || true
            xcrun simctl launch "$PAD" nz.zheha.poki -pokiScreen "$screen" > /dev/null
            sleep 4
            xcrun simctl io "$PAD" screenshot "shots/ipad-$screen.png" > /dev/null
            xcrun simctl spawn "$PAD" launchctl list > out/simulator/launchctl.txt 2>&1 || true
            grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { echo "::error::Poki died on the $screen screen (iPad)"; crashed=1; }
          done
          xcrun simctl shutdown "$PAD" || true; xcrun simctl delete "$PAD" || true
          ls shots
          # No crash anywhere on the way: any Poki crash report fails the build.
          if ls ~/Library/Logs/DiagnosticReports/Poki* > /dev/null 2>&1; then
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/Poki* | head -2); do echo "== $f"; head -80 "$f"; cp "$f" out/simulator/ || true; done
            crashed=1
          fi
          [ "$crashed" = 0 ] || exit 1

      # The app's own logic against a fake launcher: tunnel loss named to the agent, pairing
      # refusal and acceptance, the agent's view of the runner.
      - name: App unit tests (simulator)
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test -project native/ios-app/Poki.xcodeproj -scheme Poki -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/sim \
            -only-testing:PokiTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log | grep -E "Test Case|error:|failed|passed|TEST (SUCCEEDED|FAILED)|\*\* " 
          grep -q "TEST SUCCEEDED" build/tests.log

      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: |
            out/simulator/
            shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-build-log
          path: build/app-*.log
