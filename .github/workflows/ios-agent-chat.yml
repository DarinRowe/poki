# Poki's own agent end to end on the simulator, inside Poki (the in-process path). A scripted
# OpenAI-compatible model runs on the Mac (native/ios-app/scripts/mock-model.py); Poki's chat is pointed
# at it as a custom endpoint, the owner sends a task, the real pi loop in the app plans, opens Settings,
# looks and finishes; the session is saved; then an outside agent's ask_poki hands a second task to
# Poki's agent. The probe's record (Documents/inprocess-probe.json) and the model's request log are
# checked and kept, with a screenshot of the Sessions list afterwards.
name: iOS agent chat

on:
  # Manual only (Actions > Run workflow), so nothing runs on every push in this repository.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-chat:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: PokiLauncher for the simulator
        run: |
          set -euo pipefail
          native/launcher/fetch-idevice.sh
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-ios-sim
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
      - name: Build Poki (Debug) for the simulator
        run: |
          set -euo pipefail
          native/ios-app/scripts/make-assets.sh
          brew install xcodegen
          xcodegen generate --spec native/ios-app/project.yml
          mkdir -p build
          xcodebuild build \
            -project native/ios-app/Poki.xcodeproj -scheme Poki -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 2>&1 | tee build/sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/Poki.app || { grep -B2 -A6 "error:" build/sim.log | head -80; exit 1; }
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          sdk = tuple(int(v) for v in sys.argv[1].split('.'))
          def version(r): return tuple(int(v) for v in r.rsplit('iOS-', 1)[1].split('-'))
          runtimes = sorted((r for r in d if 'iOS-' in r and version(r) <= sdk), key=version, reverse=True)
          phones = [x for r in runtimes for x in d[r] if x['name'].startswith('iPhone')]
          pro = [x for x in phones if 'Pro' in x['name'] and 'Max' not in x['name']]
          print((pro or phones)[0]['udid'])" "$(xcrun --sdk iphonesimulator --show-sdk-version)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/Poki.app
      - name: Chat with Poki's agent (scripted model)
        run: |
          set -o pipefail
          python3 native/ios-app/scripts/mock-model.py --port 8765 --log build/model-requests.jsonl &
          MOCK=$!
          X="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer"
          export SIMCTL_CHILD_POKI_SIMULATOR_DEVELOPER_DIR="$X"
          export SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$X/Library/Frameworks:$X/Library/PrivateFrameworks"
          export SIMCTL_CHILD_DYLD_LIBRARY_PATH="$X/usr/lib"
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "Poki" AND (eventMessage BEGINSWITH "PokiInProcess" OR eventMessage CONTAINS "[chat]")' > build/agent-chat.log 2>&1 &
          LOGPID=$!
          xcrun simctl launch "$UDID" nz.zheha.poki -pokiInProcess chat -pokiProbeModelURL http://127.0.0.1:8765/v1
          DOCS="$(xcrun simctl get_app_container "$UDID" nz.zheha.poki data)/Documents"
          for i in $(seq 1 60); do
            [ -s "$DOCS/inprocess-probe.json" ] && break
            if ls ~/Library/Logs/DiagnosticReports/Poki-*.ips >/dev/null 2>&1; then echo "::error::Poki crashed"; break; fi
            sleep 5
          done
          kill $LOGPID 2>/dev/null || true
          cp "$DOCS/inprocess-probe.json" build/ 2>/dev/null || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Poki-*.ips 2>/dev/null | head -1); do head -120 "$f"; cp "$f" build/ || true; done
          # The Sessions list with the two sessions, as the owner would open it.
          xcrun simctl terminate "$UDID" nz.zheha.poki || true
          xcrun simctl launch "$UDID" nz.zheha.poki > /dev/null
          sleep 5
          xcrun simctl io "$UDID" screenshot build/sessions-after.png > /dev/null || true
          xcrun simctl terminate "$UDID" nz.zheha.poki || true
          kill $MOCK 2>/dev/null || true
          echo "--- model requests"; cat build/model-requests.jsonl || true
          echo "--- probe"; cat build/inprocess-probe.json || true
          python3 - <<'PY'
          import json, sys
          probe = json.load(open("build/inprocess-probe.json"))
          steps = {e.get("step"): e for e in probe}
          requests = [json.loads(l) for l in open("build/model-requests.jsonl")]
          failures = []
          def need(ok, what):
              print(("ok   " if ok else "FAIL ") + what)
              if not ok: failures.append(what)
          need(steps.get("prepare", {}).get("ok") is True, "in-process automation ready")
          chat = steps.get("chat", {})
          names = [c["name"] for c in chat.get("calls", [])]
          need(not chat.get("running", True), "the chat's task ended")
          need(names[:4] == ["report_plan", "do", "look", "finish_task"], f"pi ran the scripted calls ({names})")
          need(all(c["ok"] for c in chat.get("calls", [])), "every tool call succeeded")
          need(any("Settings is open" in r for r in chat.get("replies", [])), "Poki answered in the chat")
          need(not chat.get("problems"), f"no problem notes ({chat.get('problems')})")
          need(steps.get("chat_saved", {}).get("saved") is True, "the chat was saved as a session")
          need(any(r["pictures"] > 0 for r in requests), "a screenshot reached the model")
          need(any("look" in r["tools"] and "finish_task" in r["tools"] for r in requests), "the model saw Poki's tools")
          handoff = steps.get("ask_poki", {})
          need(handoff.get("error") is False and "Settings is open" in handoff.get("text", ""), "ask_poki returned Poki's result")
          need(steps.get("handoff_saved", {}).get("count", 0) >= 1, "the hand-off was saved as a session")
          sys.exit(1 if failures else 0)
          PY
      - name: Summary
        if: always()
        run: |
          { echo "## Poki agent chat, end to end ($(git rev-parse --short HEAD))"; echo; echo '```'; python3 -c "
          import json
          for e in json.load(open('build/inprocess-probe.json')):
              if e.get('step') in ('prepare','chat','chat_saved','ask_poki','handoff_saved'):
                  print(e.get('step'), {k: v for k, v in e.items() if k in ('ok','seconds','saved','error','count','running')})
          " 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-chat
          path: |
            build/inprocess-probe.json
            build/model-requests.jsonl
            build/agent-chat.log
            build/sessions-after.png
            build/*.ips
