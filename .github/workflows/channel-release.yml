# An Alpha or Pre-alpha release: push a tag ios-alpha-X.Y.Z-N or ios-prealpha-X.Y.Z-N
# (native/ios-app/scripts/cut-release.sh alpha|pre-alpha makes one).
# X.Y.Z is native/ios-app/VERSION at the tagged commit and N is its commit count, so every commit has
# one build number and later commits on a branch always get bigger ones. Builds Poki from that commit
# and publishes a GitHub prerelease with Poki-external-X.Y.Z-N.ipa, Poki-X.Y.Z-N.ipa,
# Poki-signing.zip and SHA256SUMS: the same files as an ios-v* release, so Poki Setup installs it
# the same way. Alphas are builds picked for early testers; pre-alphas are untested snapshots. Each
# reaches people who chose that channel (or a less stable one) in Poki Setup. See docs/release-channels.md.
name: Alpha and pre-alpha

on:
  # Tag-only: never runs on branch pushes. Neither pattern matches release.yml's ios-v*.*.*.
  push:
    tags: ['ios-alpha-*', 'ios-prealpha-*']

permissions:
  contents: read

concurrency:
  group: channel-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      channel: ${{ steps.v.outputs.channel }}
      title: ${{ steps.v.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n' < native/ios-app/VERSION)"
          BUILD="$(git rev-list --count HEAD)"
          case "$GITHUB_REF_NAME" in
            ios-prealpha-*) CHANNEL=prealpha; TITLE=pre-alpha ;;
            ios-alpha-*) CHANNEL=alpha; TITLE=alpha ;;
            *) echo "::error::tags look like ios-alpha-X.Y.Z-N or ios-prealpha-X.Y.Z-N"; exit 1 ;;
          esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::native/ios-app/VERSION is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_REF_NAME" != "ios-$CHANNEL-$VERSION-$BUILD" ]; then
            echo "::error::this commit is Poki $VERSION ($BUILD), so its tag must be ios-$CHANNEL-$VERSION-$BUILD (native/ios-app/scripts/cut-release.sh names it for you)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

  app:
    needs: version
    uses: ./.github/workflows/ios-app.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}

  publish:
    needs: [version, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: Poki-unsigned, path: app }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          TITLE: ${{ needs.version.outputs.title }}
        run: |
          set -euo pipefail
          mkdir release
          cp app/Poki-unsigned.ipa "release/Poki-$VERSION-$BUILD.ipa"
          cp app/Poki-external-unsigned.ipa "release/Poki-external-$VERSION-$BUILD.ipa"
          cp app/Poki-signing.zip release/
          (cd release && sha256sum *.ipa > SHA256SUMS && cat SHA256SUMS)
          # What changed since the previous release on this channel (or the last 15 commits for the first one).
          previous="$(git tag --list "ios-$CHANNEL-*" --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" HEAD; then
            range="$previous..HEAD"; since="since $previous"
          else
            range="-15"; since="(latest commits)"
          fi
          {
            if [ "$CHANNEL" = prealpha ]; then
              echo "Pre-alpha: Poki $VERSION ($BUILD), built from $(git rev-parse --short HEAD). An untested snapshot for the Pre-alpha channel in Poki Setup; it can break. Use the Beta or Stable channel for anything you rely on."
            else
              echo "Alpha: Poki $VERSION ($BUILD), built from $(git rev-parse --short HEAD). An early build for the Alpha channel in Poki Setup; expect rough edges. Use the Beta or Stable channel for anything you rely on."
            fi
            echo
            echo "Install Poki-external with Poki Setup, or sign either IPA with your own tool (entitlements in Poki-signing.zip). See native/ios-app/README.md."
            echo
            echo "### Changes $since"
            git log --no-merges --format='- %s (%h)' $range | head -60
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Poki $VERSION ($BUILD) $TITLE" --notes-file notes.md --prerelease --latest=false
