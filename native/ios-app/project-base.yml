# Shared app and widget configuration for the local-VPN and external-connection builds.
name: Poki
options:
  bundleIdPrefix: nz.zheha.poki
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PokiCore:
    path: ../ios/PokiCore
  # Google's WebRTC, prebuilt (BSD-3-Clause), for the voice conversation with the Realtime API.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 155.0.0
settings:
  base:
    POKI_BUNDLE_ID: nz.zheha.poki
    POKI_APP_GROUP: group.nz.zheha.poki
    POKI_DISPLAY_NAME: Poki
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEBUG_INFORMATION_FORMAT: dwarf
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Poki:
    type: application
    platform: iOS
    sources:
      - path: Poki
      - path: Shared
    info:
      path: Poki/Info.plist
      properties:
        CFBundleDisplayName: $(POKI_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PokiAppGroup: $(POKI_APP_GROUP)
        # English and Simplified Chinese (Shared/Localizable.xcstrings, Poki/InfoPlist.xcstrings); Poki
        # follows the iPhone's language.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        # Every page is the website's blue (or the night blue): white status bar text throughout.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageName: Bear
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Geist (SIL OFL 1.1, Shared/Fonts) for the Live Activity, in both bundles: the widget
        # extension draws the island and falls back to SF Pro without its own copy.
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, Geist-Bold.ttf, Geist-Black.ttf]
        # While Poki is on, background location (with the blue location pill) keeps the app, and with it
        # the relay connection and the launcher, running; silent audio is the fallback. Poki never reads
        # or sends the location itself.
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: Poki keeps running in the background while it is on, so agents can reach this iPhone. Poki does not record or send your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: Poki keeps running in the background while it is on, so agents can reach this iPhone. Poki does not record or send your location.
        CFBundleURLTypes:
          - CFBundleURLName: nz.zheha.poki
            CFBundleURLSchemes: [poki]
        NSLocalNetworkUsageDescription: Poki connects to this iPhone's own developer services to pair with it and to run the automation, and to the voice bridge on your Mac.
        NSMicrophoneUsageDescription: Poki listens while you talk to it in Voice, and sends that audio to OpenAI to understand what you ask.
        # The voice bridge runs on the person's Mac on the local network, over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices: [_remotepairing-pairable-host._tcp, _remotepairing-manual-pairing._tcp]
        LSApplicationQueriesSchemes: [karing, surge, loon, shadowrocket, sing-box]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Poki/Poki.entitlements
      properties:
        com.apple.security.application-groups: [$(POKI_APP_GROUP)]
    dependencies:
      - target: PokiWidgets
      - package: PokiCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POKI_BUNDLE_ID)
        # PokiLauncher: the Rust static library from native/launcher, built for aarch64-apple-ios
        # before this project (see .github/workflows/ios-app.yml).
        SWIFT_OBJC_BRIDGING_HEADER: Poki/Runtime/Poki-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../launcher/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../launcher/target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../launcher/target/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: [-lpoki_launcher, -lc++, -framework, Security, -framework, SystemConfiguration]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PokiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokiTests]
    dependencies:
      - target: Poki
      - package: PokiCore
    settings:
      base:
        # @testable import Poki re-reads the app's bridging header, which includes the launcher's C header.
        HEADER_SEARCH_PATHS: $(SRCROOT)/../launcher/include
  PokiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PokiWidgets
      - path: Shared
    info:
      path: PokiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Poki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PokiAppGroup: $(POKI_APP_GROUP)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, Geist-Bold.ttf, Geist-Black.ttf]
    entitlements:
      path: PokiWidgets/PokiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(POKI_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POKI_BUNDLE_ID).widgets

schemes:
  Poki:
    build:
      targets:
        Poki: all
        PokiWidgets: all
        PokiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PokiTests]
    archive:
      config: Release
